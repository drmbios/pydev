name: C tool quality checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install SQLite development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Strict release build and tests
        run: make clean && make -j2 && make check
      - name: Python counterparts and tests
        run: make python-check
      - name: MCP stdio integration
        run: python3 -m pip install '.[mcp]' && make mcp-check
      - name: Build without SQLite
        run: make check-no-sqlite
      - name: Build without libcurl
        run: make check-no-curl
      - name: Address and undefined-behavior sanitizers
        run: make sanitize
